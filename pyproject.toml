# uv workspace root: dev tooling only, not a package. The wheels live in packaging/*
# (docs/spec/50-engineering/50-repository-layout.md).
[project]
name = "porto-dev"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false

# The wheels are members so `uv run` inside packaging/* uses this root .venv.
[tool.uv.workspace]
members = ["packaging/porto"]

[tool.uv.sources]
porto = { workspace = true }

[dependency-groups]
dev = [
    # Built by maturin on `uv sync`; `maturin develop` rebuilds it faster while iterating.
    "porto",
    "maturin>=1.16,<2",
    "pytest>=9",
    "pyright>=1.1.400",
    "ruff>=0.14",
    "towncrier>=25",
    # The asyncio baseline the benchmarks compare against (M0 kill criterion). uvloop does not
    # build on Windows, so the uv sync there leaves it out.
    "uvloop>=0.22; sys_platform != 'win32'",
]

[tool.ruff]
target-version = "py311"
# Same as rustfmt's default, so Rust and Python wrap at the same column.
line-length = 100
src = ["python", "tests/python", "tests/typing"]
# Python sources only: the snippets in README.md and docs/spec/ are illustrative, not code.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["porto"]

[tool.ruff.format]
docstring-code-format = true

# ADR-028: the public API is checked strict, from python/ and from the
# consumer's side in tests/typing/. tests/typing/should_fail/ holds samples that
# MUST fail strict; tests/typing/test_should_fail.py runs pyright on them through
# should_fail/pyrightconfig.json, which extends this table and undoes the exclude.
[tool.pyright]
include = ["python", "tests/typing"]
exclude = ["tests/typing/should_fail"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/typing"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "slow: long-running; deselect with -m 'not slow'",
    "compat: runs a third-party library's suite on porto (52-testing-strategy.md item 7)",
    "deterministic: runs under porto.testing's deterministic scheduler",
]

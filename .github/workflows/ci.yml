name: ci

# The check list in CLAUDE.md (Build & Test), split into the jobs of
# docs/spec/50-engineering/51-build-ci-release.md §2. Third-party actions are pinned by commit
# SHA (40-security-and-limits.md, supply chain); the comment names the tag the SHA resolves to.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest commit of a branch (or of main) runs: a new push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only bloat the cache on a fresh runner.
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain and its components come from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: cargo fmt --all --check
      # The venv first: clippy builds porto-py, and pyo3 needs an interpreter to build against.
      - run: uv sync
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # No borrowed-reference C APIs in porto-py (25-cpython-integration-and-memory.md §3).
      - run: uv run python scripts/check_borrowed_refs.py
      # No Rust lock held across a call that can run Python code (25 §2 P3).
      - run: uv run python scripts/check_lock_across_python.py
      # packaging/porto/THIRD_PARTY_LICENSES.md must match Cargo.lock.
      - run: uv run python scripts/third_party_licenses.py --check
      # Every rule of the structured-concurrency spec (15) has a test named after it (52 §3).
      - run: uv run python scripts/rule_matrix.py --check 15
      # Likewise for the sync primitives and channels (16, rules SY1-SY39).
      - run: uv run python scripts/rule_matrix.py --check 16

  rust-test:
    name: rust-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest
      # Without porto-py, so porto-core and porto build and test with no Python around. The
      # bindings are tested from Python in py-test.
      - run: cargo nextest run --workspace --exclude porto-py
      # nextest does not run doctests.
      - run: cargo test --workspace --exclude porto-py --doc

  py-test:
    name: py-test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python: ["3.11", "3.14"]
        event: ["${{ github.event_name }}"]
        # The repository is private, so minutes count (macOS 10x, Windows 2x): pull requests test
        # 3.11 on Linux only; pushes to main run the full matrix.
        exclude:
          - { os: macos-15, python: "3.11", event: pull_request }
          - { os: windows-latest, python: "3.11", event: pull_request }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # One Rust cache per Python: porto-py is built against that interpreter.
          key: py${{ matrix.python }}
      # Sets UV_PYTHON, so `uv sync` makes the venv with this Python and maturin builds the
      # editable porto (pyo3 included) against that same interpreter.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync
      - run: uv run pytest -q

  # porto built without --release, so the debug_asserts of porto-core and porto-py run under
  # the Python tests (porto-szb.114: a waiter left filed with its scope only panicked there).
  # tests/python/test_examples.py fails on any stderr output, which is where a panic in a drop
  # shows up. It runs on a debug CPython (Py_DEBUG), whose assertions validate every object the
  # collector starts tracking (porto-txa: a reused freelist object tracked before its new value
  # was written only crashed there).
  py-test-debug:
    name: py-test-debug (ubuntu-latest, 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: py3.14-pydebug
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14+debug"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      # The dev tools without porto: `uv sync` would build it in release.
      - run: uv sync --no-install-package porto
      - run: uv run --no-sync python -c 'import sys; assert hasattr(sys, "gettotalrefcount"), "not a debug CPython"'
      - run: uv run --no-sync --directory packaging/porto maturin develop
      # --no-sync: a sync would replace the debug build with a release one.
      - run: uv run --no-sync pytest -q

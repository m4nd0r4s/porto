[package]
name = "porto-py"
description = "Python bindings for Porto, built as the `porto._core` extension module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "porto_py"
# cdylib for the extension module, rlib so tests and other crates can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
parking_lot.workspace = true
porto-core.workspace = true
# The I/O driver the Python lane parks in (12-scheduler-and-lanes.md §9).
porto-io.workspace = true
# The sockets the Python `porto.net` types wrap (17-networking-tls-dns.md §1).
porto-net.workspace = true
pyo3.workspace = true
socket2.workspace = true

[target.'cfg(unix)'.dependencies]
# The signal numbers of the default handling (18-fs-process-signals.md §3).
libc.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

[lints]
workspace = true

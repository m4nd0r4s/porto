[package]
name = "porto-net"
description = "Porto's TCP sockets without Python: the listening socket, nonblocking accept and the socket options."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
socket2.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# `SOCK_NONBLOCK | SOCK_CLOEXEC` for `accept4`; also `fcntl(F_GETFD)` in the tests, to check
# that sockets are close-on-exec.
libc = "0.2"
